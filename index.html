<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google-site-verification" content="G8iAgTVngtVbpMFuyVZ0HO63D3DuInPMY5vxYn-_TVk" />
  <title>Just Local Notes</title>
</head>

<body class="light">
  <div class="header">
    <div class="header-brand">
      <h3>Just Local Notes</h3>
    </div>

    <div class="header-center">
      <div class="input-wrapper">
        <label for="key" class="input-label">Note Title:</label>
        <input id="key" class="key-input" placeholder="Untitled Note" onchange="onKeyChange(event)">
        <button class="new-btn" onclick="newNote()">+ New Note</button>
      </div>
    </div>

    <div class="header-actions">
      <button id="dark-btn" class="theme-toggle-btn rotate-btn" title="Switch to Dark Theme" onclick="onThemeChange()">
        <svg class="theme-svg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
          fill="currentColor" viewBox="0 0 24 24">
          <path fill-rule="evenodd"
            d="M13 3a1 1 0 1 0-2 0v2a1 1 0 1 0 2 0V3ZM6.343 4.929A1 1 0 0 0 4.93 6.343l1.414 1.414a1 1 0 0 0 1.414-1.414L6.343 4.929Zm12.728 1.414a1 1 0 0 0-1.414-1.414l-1.414 1.414a1 1 0 0 0 1.414 1.414l1.414-1.414ZM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm-9 4a1 1 0 1 0 0 2h2a1 1 0 1 0 0-2H3Zm16 0a1 1 0 1 0 0 2h2a1 1 0 1 0 0-2h-2ZM7.757 17.657a1 1 0 1 0-1.414-1.414l-1.414 1.414a1 1 0 1 0 1.414 1.414l1.414-1.414Zm9.9-1.414a1 1 0 0 0-1.414 1.414l1.414 1.414a1 1 0 0 0 1.414-1.414l-1.414-1.414ZM13 19a1 1 0 1 0-2 0v2a1 1 0 1 0 2 0v-2Z"
            clip-rule="evenodd" />
        </svg>
      </button>
      <button id="light-btn" class="theme-toggle-btn rotate-btn" title="Switch to Light Theme"
        onclick="onThemeChange()">
        <svg class="theme-svg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none"
          viewBox="0 0 24 24">
          <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 5V3m0 18v-2M7.05 7.05 5.636 5.636m12.728 12.728L16.95 16.95M5 12H3m18 0h-2M7.05 16.95l-1.414 1.414M18.364 5.636 16.95 7.05M16 12a4 4 0 1 1-8 0 4 4 0 0 1 8 0Z" />
        </svg>
      </button>
      <!-- <button class="btn save-btn" onclick="save()">Save</button> -->
      <button class="btn clear-btn" onclick="clearNote()">Clear</button>
    </div>
  </div>

  <div class="key_note">
    <div id="keys" class="sideBar-keys"></div>
    <div id="drag-content" class="draggable"></div>
    <textarea id="note-content" class="note-area" placeholder="Start typing your note here..."
      oninput="onNoteChange(event)"></textarea>
  </div>

  <script>
    // window.addEventListener('beforeunload', function (event) {
    //   event.preventDefault();
    // });

    window.addEventListener('load', function () {
      const request = indexedDB.open("YourLocalNoteDB", 1);
      request.onupgradeneeded = (event) => {
        const db = event.target.result;
        if (!db.objectStoreNames.contains("notes")) {
          const objectStore = db.createObjectStore("notes", { keyPath: "id", autoIncrement: true });
          objectStore.createIndex("id", "id", { unique: true });
        }
      }
    });

    window.addEventListener('load', function () {
      const current_theme = localStorage.getItem("*theme*");
      const light_btn = document.getElementById("light-btn");
      const dark_btn = document.getElementById("dark-btn");
      const body_element = document.getElementsByTagName("body")[0];
      if (current_theme === "dark") {
        dark_btn.style.display = "none";
        light_btn.style.display = "inline-flex";
        body_element.classList.add("dark");
        body_element.classList.remove("light");
      } else {
        light_btn.style.display = "none";
        dark_btn.style.display = "inline-flex";
        body_element.classList.add("light");
        body_element.classList.remove("dark");
      }
    });

    const dragContent = document.getElementById("drag-content");
    const keysComp = document.getElementById("keys");
    const noteElement = document.getElementById("note-content");
    let startX = 0;
    let startWidth = 0;
    let noteStartWidth = 0;

    dragContent.addEventListener('mousedown', (e) => {
      e.preventDefault();
      startX = e.clientX;
      startWidth = parseInt(document.defaultView.getComputedStyle(keysComp).width, 10);
      noteStartWidth = parseInt(document.defaultView.getComputedStyle(noteElement).width, 10);
      window.addEventListener('mousemove', resizeComponent);
      window.addEventListener('mouseup', stopDrag);
    });

    function resizeComponent(e) {
      const currentMoveValue = e.clientX - startX;
      const newwidth = startWidth + currentMoveValue;
      if (newwidth > 120) {
        keysComp.style.width = `${newwidth}px`;
      }
    }

    function stopDrag() {
      window.removeEventListener('mousemove', resizeComponent);
      window.removeEventListener('mouseup', stopDrag);
    }

    function onThemeChange() {
      const current_theme = localStorage.getItem("*theme*");
      const light_btn = document.getElementById("light-btn");
      const dark_btn = document.getElementById("dark-btn");
      const body_element = document.getElementsByTagName("body")[0];
      if (current_theme === "light" || !current_theme) {
        localStorage.setItem("*theme*", "dark");
        dark_btn.style.display = "none";
        light_btn.style.display = "inline-flex";
        body_element.classList.add("dark");
        body_element.classList.remove("light");
      } else {
        localStorage.setItem("*theme*", "light");
        light_btn.style.display = "none";
        dark_btn.style.display = "inline-flex";
        body_element.classList.add("light");
        body_element.classList.remove("dark");
      }
    }

    function addNoteToDB(value) {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("YourLocalNoteDB", 1);
        request.onsuccess = (event) => {
          const db = event.target.result;
          const transaction = db.transaction(["notes"], "readwrite");
          const store = transaction.objectStore("notes");
          const addRequest = store.add(value);
          addRequest.onsuccess = () => resolve(addRequest.result);
          addRequest.onerror = () => reject("Error on create note");
        }
      });
    }

    function getAllNotesFromDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("YourLocalNoteDB", 1);
        request.onsuccess = (event) => {
          const db = event.target.result;
          const transaction = db.transaction(["notes"], "readonly");
          const store = transaction.objectStore("notes");
          const getRequest = store.getAll();
          getRequest.onsuccess = () => resolve(getRequest.result);
          getRequest.onerror = () => reject("Failed to fetch notes.");
        }
      });
    }

    function getNoteById(id) {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("YourLocalNoteDB", 1);
        request.onsuccess = (event) => {
          const db = event.target.result;
          const transaction = db.transaction(["notes"], "readonly");
          const store = transaction.objectStore("notes");
          const getRequest = store.get(id);
          getRequest.onsuccess = () => resolve(getRequest.result);
          getRequest.onerror = () => reject("Failed to fetch notes.");
        }
      });
    }

    async function updateNoteById(updatingData) {
      if (updatingData && updatingData.id) {
        const getRecord = await getNoteById(updatingData.id);
        updatingData = { ...getRecord, ...updatingData };
      }
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("YourLocalNoteDB", 1);
        request.onsuccess = (event) => {
          const db = event.target.result;
          const transaction = db.transaction(["notes"], "readwrite");
          const store = transaction.objectStore("notes");
          const updateRequest = store.put(updatingData);
          updateRequest.onsuccess = () => resolve("Note updated successfully.");
          updateRequest.onerror = () => reject("Failed to update the note.");
        };
        request.onerror = () => reject("Failed to open database.");
      });
    }

    function deleteNoteById(id) {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open("YourLocalNoteDB", 1);
        request.onsuccess = (event) => {
          const db = event.target.result;
          const transaction = db.transaction(["notes"], "readwrite");
          const store = transaction.objectStore("notes");
          const deleteRequest = store.delete(id);
          deleteRequest.onsuccess = () => resolve("Note deleted successfully.");
          deleteRequest.onerror = () => reject("Failed to delete the note.");
        };
        request.onerror = () => reject("Failed to open database.");
      });
    }

    // async function save() {
    //   const key = document.getElementById("key").value;
    //   const keyId = document.getElementById("key").name;
    //   const value = document.getElementById("note-content").value;
    //   let generatedId = undefined;
    //         console.log(key, keyId, "jkhgfcxzx_____",generatedId)

    //   if (key && !keyId) {
    //     generatedId = await addNoteToDB({ key: key, value: value });
    //   } else if (keyId) {
    //     await updateNoteById({ id: keyId, key: key, value: value });
    //   }
    //   if (generatedId) {
    //     document.getElementById("note-content").name = generatedId;
    //     document.getElementById("key").name = generatedId;
    //   }
    //   await showKeyList();
    //   setSelectedBackground(keyId || generatedId);
    // }

    async function onKeyChange(e) {
      const noteValue = document.getElementById("note-content").value;
      const keyValue = e.target.value;
      const keyId = e.target.name;
      let generatedId = undefined;
      if (keyValue && keyId) {
        await updateNoteById({ key: keyValue, id: Number(keyId), value: noteValue });
      } else {
        generatedId = await addNoteToDB({ key: keyValue, value: noteValue });
      }
      if (generatedId) {
        document.getElementById("note-content").name = generatedId;
        document.getElementById("key").name = generatedId;
      }
      await showKeyList();
      setSelectedBackground(keyId || generatedId);
    }

    async function onNoteChange(e) {
      const keyValue = document.getElementById("key").value;
      const keyId = document.getElementById("key").name;
      let generatedId = undefined;
      if (keyValue && keyId) {
        await updateNoteById({ key: keyValue, id: Number(keyId), value: e.target.value });
      } else if (keyValue) {
        generatedId = await addNoteToDB({ key: keyValue, value: e.target.value });
      } else {
        generatedId = await addNoteToDB({ key: "(Unknown)", value: e.target.value });
        document.getElementById("key").value = `(Unknown_${generatedId})`;
        await updateNoteById({ key: `(Unknown_${generatedId})`, id: generatedId, value: e.target.value });
      }
      if (generatedId) {
        document.getElementById("note-content").name = generatedId;
        document.getElementById("key").name = generatedId;
      }
      await showKeyList();
      setSelectedBackground(keyId || generatedId);
    }

    function newNote() {
      const noteValue = document.getElementById("note-content").value;
      const noteKey = document.getElementById("key").value;
      if (noteValue && !noteKey) {
        const confirmNew = confirm("Do you want to clear the existing value in notes?");
        if (!confirmNew) return;
      }

      document.getElementById("key").value = "";
      document.getElementById("note-content").value = "";
      document.getElementById("key").name = "";
      document.getElementById("note-content").name = "";

      const elements = Array.from(document.getElementsByClassName("keyItem"));
      for (let i = 0; i < elements.length; i++) {
        elements[i].classList.remove("active");
      }
    }

    function loadKey(data) {
      data = JSON.parse(data);

      document.getElementById("key").value = data.key;
      document.getElementById("note-content").value = data?.value ? data?.value : "";

      document.getElementById("key").name = data.id;
      document.getElementById("note-content").name = data.id;

      setSelectedBackground(data.id);
    }

    function setSelectedBackground(id) {
      const elements = Array.from(document.getElementsByClassName("keyItem"));
      elements.forEach(el => {
        const nameAttr = el.getAttribute('name');
        if (nameAttr && nameAttr.includes(String(id))) {
          el.classList.add("active");
        } else {
          el.classList.remove("active");
        }
      });
    }

    function clearNote() {
      document.getElementById("note-content").value = "";
    }

    function clearKey() {
      const keyInput = document.getElementById("key");
      keyInput.value = "";
      keyInput.name = "";
      keyInput.dispatchEvent(new Event("input"));
    }

    async function deleteKey(event, datastring) {
      event.stopPropagation();
      const parsedData = JSON.parse(datastring);
      const confirmDelete = confirm(`Do you want to delete this "${parsedData.key}"?`);
      const selectedKeyId = document.getElementById("key").name;
      if (confirmDelete) {
        await deleteNoteById(parsedData.id);
        showKeyList();
        if (parsedData.id === Number(selectedKeyId)) {
          clearKey();
          clearNote();
        }
      }
    }

    // async function showKeyList() {
    //   const noteList = await getAllNotesFromDB();
    //   const keyListDiv = document.getElementById("keys");
    //   keyListDiv.innerHTML = ``;
    //   for (let i = noteList.length - 1; i >= 0; i--) {
    //     const data = noteList[i];
    //     const safeData = JSON.stringify(data).replace(/"/g, '&quot;');

    //     keyListDiv.innerHTML += `
    //       <div class="keyItem" name="${data.id}" title="${data.key}" onclick="loadKey('${safeData}')">
    //         <div class="key-title">${data.key}</div>
    //         <span class="keylist_delete" onclick="deleteKey(event, '${safeData}')" title="Delete Note">&times;</span>
    //       </div>`;
    //   }
    // }

    async function showKeyList() {
    const noteList = await getAllNotesFromDB();
    const keyListDiv = document.getElementById("keys");
    
    keyListDiv.innerHTML = ``; 

    for (let i = noteList.length - 1; i >= 0; i--) {
        const data = noteList[i];

        const keyItem = document.createElement("div");
        keyItem.className = "keyItem";
        keyItem.setAttribute("name", data.id);
        keyItem.setAttribute("title", data.key);
        
        keyItem.addEventListener("click", () => {
            loadKey(data);
        });

        keyItem.innerHTML = `<div class="key-title">${data.key}</div>`;

        const deleteSpan = document.createElement("span");
        deleteSpan.className = "keylist_delete";
        deleteSpan.title = "Delete Note";
        deleteSpan.innerHTML = "&times;";
        
        deleteSpan.addEventListener("click", (event) => {
            deleteKey(event, data); 
        });

        keyItem.appendChild(deleteSpan);
        keyListDiv.appendChild(keyItem);
    }
}


    window.onload = showKeyList;
  </script>

  <style>
    :root {
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --transition-speed: 0.2s;
      --border-radius: 8px;
    }

    body.light {
      --bg-main: #f8fafc;
      --bg-header: #ffffff;
      --bg-sidebar: #f1f5f9;
      --bg-editor: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --item-hover: #e2e8f0;
      --item-active: #e0e7ff;
      --accent-color: #3b82f6;
      --accent-hover: #2563eb;
      --save-btn-bg: #22c55e;
      --save-btn-hover: #16a34a;
      --clear-btn-bg: #ef4444;
      --clear-btn-hover: #dc2626;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
    }

    body.dark {
      --bg-main: #0f172a;
      --bg-header: #1e293b;
      --bg-sidebar: #1e293b;
      --bg-editor: #0f172a;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --item-hover: #334155;
      --item-active: #312e81;
      --accent-color: #60a5fa;
      --accent-hover: #3b82f6;
      --save-btn-bg: #15803d;
      --save-btn-hover: #166534;
      --clear-btn-bg: #b91c1c;
      --clear-btn-hover: #991b1b;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.3);
    }

    body.light #light-btn {
      display: none !important;
    }

    body.dark #dark-btn {
      display: none !important;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      padding: 0 20px;
      background-color: var(--bg-header);
      border-bottom: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      z-index: 10;
    }

    .header-brand h3 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header-center {
      flex: 1;
      display: flex;
      justify-content: center;
      max-width: 600px;
      margin: 0 20px;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 10px;
    }

    .input-label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .key-input {
      flex: 1;
      padding: 8px 12px;
      font-size: 0.875rem;
      background-color: var(--bg-main);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      outline: none;
      transition: border-color var(--transition-speed) ease;
    }

    .key-input:focus {
      border-color: var(--accent-color);
    }

    .new-btn {
      background: none;
      border: none;
      color: var(--accent-color);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      padding: 6px 10px;
      border-radius: var(--border-radius);
      transition: background-color var(--transition-speed) ease;
    }

    .new-btn:hover {
      background-color: var(--item-hover);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Buttons */
    .btn {
      padding: 8px 16px;
      font-size: 0.875rem;
      font-weight: 500;
      border: none;
      border-radius: var(--border-radius);
      cursor: pointer;
      transition: background-color var(--transition-speed) ease, transform 0.1s ease;
      color: #ffffff;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .save-btn {
      background-color: var(--save-btn-bg);
    }

    .save-btn:hover {
      background-color: var(--save-btn-hover);
    }

    .clear-btn {
      background-color: var(--clear-btn-bg);
    }

    .clear-btn:hover {
      background-color: var(--clear-btn-hover);
    }

    .theme-toggle-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      padding: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--text-main);
      transition: background-color var(--transition-speed) ease;
    }

    .theme-toggle-btn:hover {
      background-color: var(--item-hover);
    }

    .theme-svg {
      color: var(--text-main);
      transition: transform 0.4s ease;
    }

    .rotate-btn:hover .theme-svg {
      transform: rotate(30deg);
    }

    /* Workspace */
    .key_note {
      display: flex;
      flex: 1;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    /* Sidebar */
    .sideBar-keys {
      width: 260px;
      min-width: 150px;
      background-color: var(--bg-sidebar);
      border-right: 1px solid var(--border-color);
      overflow-y: auto;
      padding: 5px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .sideBar-keys::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .sideBar-keys::-webkit-scrollbar-track {
      background: transparent;
    }

    .sideBar-keys::-webkit-scrollbar-thumb {
      background-color: var(--border-color);
      border-radius: 10px;
    }

    .sideBar-keys::-webkit-scrollbar-thumb:hover {
      background-color: var(--text-muted);
    }

    .keyItem {
      padding: 6px 8px;
      border-radius: var(--border-radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.875rem;
      color: var(--text-main);
      transition: background-color var(--transition-speed) ease;
    }

    .keyItem:hover {
      background-color: var(--item-hover);
    }

    .keyItem.active {
      background-color: var(--item-active);
      font-weight: 500;
    }

    .key-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .keylist_delete {
      visibility: hidden;
      opacity: 0;
      font-size: 1.1rem;
      line-height: 1;
      color: var(--text-muted);
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 8px;
      transition: opacity 0.2s ease, background-color 0.2s ease;
    }

    .keylist_delete:hover {
      color: #ef4444;
      background-color: rgba(239, 68, 68, 0.1);
    }

    .keyItem:hover .keylist_delete {
      visibility: visible;
      opacity: 1;
    }

    /* Draggable Divider */
    .draggable {
      width: 4px;
      background-color: transparent;
      cursor: ew-resize;
      transition: background-color var(--transition-speed) ease;
      z-index: 5;
    }

    .draggable:hover,
    .draggable:active {
      background-color: var(--accent-color);
    }

    /* Editor */
    .note-area {
      flex: 1;
      height: 100%;
      border: none;
      outline: none;
      padding: 24px;
      font-family: var(--font-family);
      font-size: 1rem;
      line-height: 1.6;
      background-color: var(--bg-editor);
      color: var(--text-main);
      resize: none;
    }
  </style>
</body>

</html>
